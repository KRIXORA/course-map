<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f8cff" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Course Map</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f7fc;
      color: #0f172a;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #05070d; color: #e2e8f0; }
    }
    .card {
      max-width: 440px;
      text-align: center;
      padding: 2.25rem 1.5rem;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(15, 28, 50, 0.1);
      box-shadow: 0 20px 50px rgba(20, 40, 70, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      .card {
        background: #0b1120;
        border-color: rgba(255, 255, 255, 0.09);
      }
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #1673e6;
      margin: 0 0 0.35rem;
      line-height: 1;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.35rem; color: #64748b; font-size: 0.95rem; line-height: 1.5; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a.primary { background: #1673e6; color: #fff; }
    a.primary:hover { background: #0f5fc4; }
    a.ghost {
      background: transparent;
      color: #1673e6;
      border: 1px solid rgba(22, 115, 230, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This link doesn’t exist on Course Map. Head home to search courses or read about the project.</p>
    <div class="actions">
      <a class="primary" href="/">Go home</a>
      <a class="ghost" href="/about-me.html">About</a>
    </div>
  </div>
</body>
</html>
