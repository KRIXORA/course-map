<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f8cff" />
  <title>Offline | Course Map</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f7fc;
      color: #0f172a;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #05070d; color: #e2e8f0; }
    }
    .card {
      max-width: 420px;
      text-align: center;
      padding: 2rem 1.5rem;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(15, 28, 50, 0.1);
      box-shadow: 0 20px 50px rgba(20, 40, 70, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      .card {
        background: #0b1120;
        border-color: rgba(255, 255, 255, 0.09);
      }
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 1rem;
      border-radius: 14px;
      background: rgba(22, 115, 230, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.25rem; color: #64748b; font-size: 0.95rem; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      background: #1673e6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a:hover { background: #0f5fc4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You’re offline</h1>
    <p>
      Course Map works offline for pages you’ve already opened.
      Reconnect to browse the full catalog and open provider links.
    </p>
    <a href="index.html">Try again</a>
  </div>
</body>
</html>
